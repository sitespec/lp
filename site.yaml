specVersion: "0.5"
site:
  id: lp
  name: "SiteSpec"
  url: https://sitespec.github.io/lp
  locale: en

assets:
  favicon: /brand/favicon.svg
  appleTouchIcon: /brand/apple-touch-icon.png
  defaultOgImage: /brand/og-default.png

media:
  output: /_media
  widths: [320, 640, 960, 1280, 1600]
  formats: [avif, webp]
  quality:
    avif: 50
    webp: 78
    jpeg: 82
    png: 85

navigation:
  primary:
    - id: home
      label: Home
      href: /
    - id: features
      label: Features
      href: /features
    - id: blog
      label: Blog
      href: /blog

  features:
    - id: composition
      label: Composition
      href: /features/composition
    - id: dynamic-routes
      label: Dynamic routes
      href: /features/dynamic-routes
    - id: agent-protocol
      label: Agent protocol
      href: /features/agent-protocol

  project:
    - id: github
      label: GitHub
      href: https://github.com/sitespec/sitespec
      target: blank
    - id: npm
      label: npm
      href: https://www.npmjs.com/search?q=%40sitespec
      target: blank

seo:
  siteName: "SiteSpec"
  titleTemplate: "%s — SiteSpec"
  defaultDescription: "Demo website of SiteSpec."
  sitemap:
    enabled: true
  robots:
    index: true
  llms:
    enabled: true
  rss:
    enabled: true
    path: /rss.xml
  socialImages:
    generate: true
    format: png
    width: 1200
    height: 630
